name: Build High Stakes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Build Debian package
        run: |
          chmod 755 package/usr/bin/blackjack
          dpkg-deb --build package highstakes_1.0.0_all.deb

      - name: Create APT repository
        run: |
          rm -rf apt-repo

          mkdir -p apt-repo/pool/main/h/highstakes
          mkdir -p apt-repo/dists/stable/main/binary-all

          cp highstakes_1.0.0_all.deb \
            apt-repo/pool/main/h/highstakes/

          cd apt-repo

          dpkg-scanpackages \
            pool \
            /dev/null \
            > dists/stable/main/binary-all/Packages

          gzip -9 -kf \
            dists/stable/main/binary-all/Packages

          apt-ftparchive release dists/stable \
            > dists/stable/Release

          cd ..

      - name: Add repository information
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from email.utils import formatdate
          import time

          release = Path("apt-repo/dists/stable/Release")

          old = release.read_text()

          header = f"""Origin: High Stakes
          Label: High Stakes
          Suite: stable
          Codename: stable
          Date: {formatdate(time.time(), usegmt=True)}
          Architectures: all
          Components: main
          Description: High Stakes Blackjack APT Repository
          """

          lines = old.splitlines()

          # Keep only the checksum sections generated by apt-ftparchive.
          checksum_start = None

          for i, line in enumerate(lines):
              if line in ("MD5Sum:", "SHA1:", "SHA256:"):
                  checksum_start = i
                  break

          if checksum_start is not None:
              checksums = "\n".join(lines[checksum_start:]) + "\n"
          else:
              checksums = ""

          release.write_text(header + checksums)
          PY

      - name: Publish APT repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apt-repo
