name: Build High Stakes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Build Debian package
        run: |
          chmod 755 package/usr/bin/blackjack
          dpkg-deb --build package highstakes_1.0.0_all.deb

      - name: Create APT repository
        run: |
          rm -rf apt-repo

          mkdir -p apt-repo/pool/main/h/highstakes
          mkdir -p apt-repo/dists/stable/main/binary-all

          cp highstakes_1.0.0_all.deb \
            apt-repo/pool/main/h/highstakes/

          dpkg-scanpackages \
            apt-repo/pool \
            /dev/null \
            > apt-repo/dists/stable/main/binary-all/Packages

          gzip -9 -kf \
            apt-repo/dists/stable/main/binary-all/Packages

          cat > apt-repo/dists/stable/Release <<EOF
          Origin: High Stakes
          Label: High Stakes
          Suite: stable
          Codename: stable
          Date: $(date -Ru)
          Architectures: all
          Components: main
          Description: High Stakes Blackjack APT Repository
          EOF

          cd apt-repo

          apt-ftparchive release dists/stable \
            > dists/stable/Release.tmp

          {
            echo "Origin: High Stakes"
            echo "Label: High Stakes"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Date: $(date -Ru)"
            echo "Architectures: all"
            echo "Components: main"
            echo "Description: High Stakes Blackjack APT Repository"
            tail -n +2 dists/stable/Release.tmp
          } > dists/stable/Release

          rm dists/stable/Release.tmp

      - name: Publish APT repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apt-repo
